# GPUHub - CasaOS için docker-compose.yml (özel kurulum şablonu, sır YOK)
#
# CasaOS kurulumu:
#   1. Bu dosyanın İÇİNİ CasaOS'a yapıştırın (App Store → Custom Install → Install from docker-compose.yml).
#   2. GPUHUB_MASTER_KEY'i üretip yazın (openssl rand -base64 48). Master key'i sonra DEĞİŞTİRMEYİN -
#      değişirse tüm kayıtlı sağlayıcı anahtarları çözülemez olur!
#   3. ADMIN_PASSWORD'ü değiştirin; ilk girişte admin oluşur.
#   4. CasaOS'ta Web UI port mapping = 8090 (host portu boş değilse "8090:8080" yerine boş port seçin).
#
# GHCR paketi public; docker login gerekmez. Private kalsaydı sunucuda:
#   docker login ghcr.io -u <user> -p <read:packages PAT>

services:
  gpuhub:
    image: ghcr.io/neighboth/gpuhub:latest
    container_name: GPUHub
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      GPUHUB_MASTER_KEY: "BURAYA-COK-UZUN-RASTGELE-BIR-ANAHTAR-URETIN"
      GPUHUB_JWT_SECRET: ""                 # boş = master key'den türetilir (önerilen: ayrı)
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "BURAYI-DEGISTIRIN"   # ilk çalıştırmada admin oluşur; sonra panelden değiştirin
      GPUHUB_DB_PATH: /data/gpuhub.db
      GPUHUB_PROXY_HEALTH_URL: "https://api.ipify.org?format=json"
      GPUHUB_SCHEDULER_STRATEGY: most_quota
      GPUHUB_ROTATION_STRATEGY: most_quota
      GPUHUB_QUOTA_HIGH_WATERMARK: "0.90"
      GPUHUB_MAX_RETRIES: "3"
    volumes:
      - /DATA/AppData/gpuhub/data:/data    # CasaOS standart AppData dizini

x-casaos:
  architectures:
    - amd64
  main: gpuhub
  title:
    en_us: GPUHub
  category: Tools
  developer: Neighboth
  description:
    en_us: "Self-hosted orchestration for free-tier GPU compute providers (32 adapters, sticky 1:1 proxy binding)."
  icon: https://cdn.simpleicons.org/nvidia/76B900
  port_map: "8090"
