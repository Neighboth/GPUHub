services:
  gpuhub:
    build: .
    ports:
      - "${GPUHUB_PORT:-8080}:8080"
    env_file: .env
    volumes:
      - gpuhub_data:/data
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - gpuhub
    restart: unless-stopped

volumes:
  gpuhub_data:
  caddy_data:
